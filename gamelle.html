<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doovlab — Fiche repas</title>
<meta name="description" content="La fiche repas de votre compagnon, sur son rehausseur NFC Doovlab.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sunset: #D4692A; --sunset-light: #F0923A; --sunset-dark: #A84E1A;
    --beige: #FDF6EE; --beige-dark: #F0E6D6; --text: #2C1A0E; --muted: #9A7A60; --white: #FFFFFF;
    --green: #2D7A4F; --green-light: #E8F5EE; --amber: #B7791F; --amber-light: #FBF0DC; --red: #C0392B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Nunito', sans-serif; background: var(--beige); color: var(--text); min-height: 100vh; }

  .top-bar { background: var(--text); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .top-bar-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .top-bar-logo img { width: 30px; height: 30px; object-fit: contain; filter: brightness(10); }
  .top-bar-brand { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 16px; color: var(--beige); letter-spacing: 2px; }
  .top-bar-tagline { font-size: 12px; color: var(--sunset-light); font-style: italic; }

  .page { max-width: 480px; margin: 0 auto; padding: 28px 18px 60px; }

  .loading { text-align: center; padding: 60px 24px; }
  .loading-spinner { width: 48px; height: 48px; border: 4px solid var(--beige-dark); border-top-color: var(--sunset); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-card { background: white; border-radius: 20px; padding: 36px 28px; text-align: center; box-shadow: 0 2px 20px rgba(60,20,5,.08); }
  .error-card .icon { font-size: 46px; margin-bottom: 14px; }
  .error-card h2 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 8px; }
  .error-card p { font-size: 15px; color: var(--muted); line-height: 1.6; }
  .error-card a { color: var(--sunset); font-weight: 700; }

  .hero { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .photo-bubble { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--text); overflow: hidden; background: var(--beige-dark);
    display: flex; align-items: center; justify-content: center; font-size: 38px; flex: none; box-shadow: 0 6px 22px rgba(60,20,5,.15); }
  .photo-bubble img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .kicker { font-size: 11px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: var(--sunset); margin-bottom: 2px; }
  .dog-name { font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 700; line-height: 1.05; word-break: break-word; }

  .card { background: var(--white); border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 20px rgba(60,20,5,.06); }
  .card-title { font-size: 11px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

  /* Etat du repas */
  .status { border: 2px solid var(--amber); background: var(--amber-light); }
  .status.ok { border-color: var(--green); background: var(--green-light); }
  .status.neutral { border-color: var(--beige-dark); background: var(--white); }
  .status-big { font-family: 'Playfair Display', serif; font-size: 21px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
  .status-sub { font-size: 14px; color: #5b4636; line-height: 1.5; }
  .who { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .who-label { width: 100%; font-size: 12px; color: var(--muted); font-weight: 700; }
  .chip { border: 1.5px solid var(--beige-dark); background: #fff; border-radius: 99px; padding: 8px 14px; font: 700 14px 'Nunito', sans-serif; color: var(--text); cursor: pointer; }
  .chip.on { border-color: var(--sunset); background: #FCEBDD; color: var(--sunset-dark); }
  .fed-btn { display: block; width: 100%; margin-top: 14px; border: 0; border-radius: 50px; padding: 17px; cursor: pointer;
    font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; letter-spacing: .5px; color: #fff; background: var(--sunset);
    box-shadow: 0 6px 18px rgba(212,105,42,.35); transition: transform .15s, background .2s; }
  .fed-btn:active { transform: scale(.98); }
  .fed-btn:disabled { background: var(--muted); box-shadow: none; }
  .fed-again { display: block; margin: 12px auto 0; background: none; border: 0; color: var(--muted); font: 600 13px 'Nunito', sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .undo { margin-top: 12px; font-size: 13px; text-align: center; color: #5b4636; }
  .undo button { background: none; border: 0; color: var(--sunset); font: 800 13px 'Nunito', sans-serif; text-decoration: underline; cursor: pointer; }
  .msg { margin-top: 10px; font-size: 13px; text-align: center; color: var(--red); }

  /* Ration */
  .ration { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--beige); border-radius: 14px; padding: 12px 14px; }
  .stat b { display: block; font-family: 'Playfair Display', serif; font-size: 26px; color: var(--sunset-dark); line-height: 1.1; }
  .stat small { font-size: 12px; color: var(--muted); }
  .food { margin-top: 12px; font-size: 15px; line-height: 1.5; }
  .times { display: flex; gap: 8px; margin-top: 12px; }
  .time { flex: 1; text-align: center; border-radius: 12px; padding: 9px 4px; background: var(--beige); font-size: 12px; color: var(--muted); }
  .time b { display: block; font-size: 16px; color: var(--text); }
  .time.done { background: var(--green-light); color: var(--green); }
  .time.done b { color: var(--green); }
  .time.next { background: #fff; outline: 2px solid var(--sunset); color: var(--sunset-dark); }

  .row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--beige-dark); font-size: 15px; line-height: 1.5; }
  .card-title + .row { border-top: 0; padding-top: 0; }
  .row .ic { font-size: 20px; width: 26px; text-align: center; flex: none; }
  .row .lbl { font-size: 11px; color: var(--muted); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .pill { background: #FBE3E0; color: #9B2C22; border-radius: 99px; padding: 4px 11px; font-size: 13px; font-weight: 700; }

  .hist { list-style: none; }
  .hist li { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 8px 0; border-top: 1px dashed var(--beige-dark); }
  .hist li:first-child { border-top: 0; padding-top: 0; }
  .hist .by { color: var(--muted); }
  .empty { font-size: 14px; color: var(--muted); }

  .footer { text-align: center; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--beige-dark); }
  .footer img { width: 30px; height: 30px; object-fit: contain; margin-bottom: 8px; opacity: .4; }
  .footer p { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .footer a { color: var(--sunset); text-decoration: none; font-weight: 700; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 120px); background: var(--text); color: #fff; padding: 12px 18px;
    border-radius: 12px; font-weight: 700; font-size: 14px; transition: transform .3s; z-index: 50; visibility: hidden; }
  .toast.show { transform: translate(-50%, 0); visibility: visible; }

  @keyframes dvUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .hero, .card { animation: dvUp .5s both; }
  .card:nth-of-type(2) { animation-delay: .06s; } .card:nth-of-type(3) { animation-delay: .12s; } .card:nth-of-type(4) { animation-delay: .18s; }
  @media (prefers-reduced-motion: reduce) { .hero, .card { animation: none !important; } }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="top-bar-logo"><img src="/logo.png" alt="Doovlab"><span class="top-bar-brand">DOOVLAB</span></a>
  <span class="top-bar-tagline">Unique comme votre chien</span>
</div>

<div class="page" id="page">
  <div class="loading"><div class="loading-spinner"></div><p style="color:var(--muted);font-size:15px;">Chargement de la fiche repas...</p></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://ycsskzxbtaoekfpocgoz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ESbSaBIVfAA463W4GTDihg_77jF03Of';
const token = (new URLSearchParams(location.search).get('t') || '').trim();
const page = document.getElementById('page');
let fiche = null;
let lastLogged = null;   // { id, at } : dernier repas noté depuis ce téléphone (pour « Annuler »)
let feeder = '';

// ---------- petits outils ----------
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
async function rpc(name, args) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2000); }
function hm(d) { return d.getHours() + ' h ' + String(d.getMinutes()).padStart(2, '0'); }
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function dayWord(d, now) {
  const y = new Date(now); y.setDate(y.getDate() - 1);
  const t = new Date(now); t.setDate(t.getDate() + 1);
  if (sameDay(d, now)) return "aujourd'hui";
  if (sameDay(d, y)) return 'hier';
  if (sameDay(d, t)) return 'demain';
  return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function mealName(d, n) {
  if (n <= 1) return 'le repas';
  const h = d.getHours();
  return h < 11 ? 'le repas du matin' : h < 15 ? 'le repas de midi' : 'le repas du soir';
}

// ---------- créneaux de repas ----------
// Chaque horaire « possède » la période qui va du milieu avec l'horaire précédent
// au milieu avec le suivant. Un repas donné dans cette période compte pour cet horaire
// (on peut donc nourrir un peu en avance ou en retard).
function slots(times, now) {
  const out = [];
  for (let d = -2; d <= 2; d++) for (const t of times) {
    const [h, m] = t.split(':').map(Number);
    const x = new Date(now); x.setDate(x.getDate() + d); x.setHours(h, m, 0, 0); out.push(x);
  }
  out.sort((a, b) => a - b);
  return out.map((s, i) => ({
    at: s,
    lo: i ? (out[i - 1].getTime() + s.getTime()) / 2 : -Infinity,
    hi: i < out.length - 1 ? (s.getTime() + out[i + 1].getTime()) / 2 : Infinity
  }));
}
function slotOf(list, date) { const t = date.getTime(); return list.find(s => t >= s.lo && t < s.hi); }
function mealIn(slot, meals) { return meals.find(r => { const t = r.date.getTime(); return t >= slot.lo && t < slot.hi; }); }

// ---------- rendu ----------
function render() {
  const f = fiche;
  const now = new Date();
  const meals = (f.repas || []).map(r => ({ id: r.id, by: r.by, date: new Date(r.at) }));
  const times = (f.times || []).filter(Boolean);
  const name = f.dog_name || 'Votre chien';
  const last = meals[0];

  // --- état du repas
  let cls = 'neutral', big = '', sub = '', showBtn = true;
  if (times.length) {
    const list = slots(times, now);
    const cur = slotOf(list, now);
    const given = mealIn(cur, meals);
    const curName = mealName(cur.at, times.length);
    if (given) {
      const nxt = list[list.indexOf(cur) + 1].at;
      cls = 'ok';
      big = `${esc(name)} a mangé ✔`;
      sub = `${cap(curName)} donné ${dayWord(given.date, now) === "aujourd'hui" ? '' : dayWord(given.date, now) + ' '}à ${hm(given.date)}${given.by ? ' par ' + esc(given.by) : ''}`
          + ` · prochain repas ${dayWord(nxt, now)} à ${hm(nxt)}`;
      showBtn = false;
    } else {
      cls = '';
      big = `${cap(curName)} pas encore donné`;
      sub = (now < cur.at ? `Prévu ${dayWord(cur.at, now) === "aujourd'hui" ? '' : dayWord(cur.at, now) + ' '}à ${hm(cur.at)}` : `Prévu à ${hm(cur.at)}`)
          + (last ? ` · dernier repas ${dayWord(last.date, now)} à ${hm(last.date)}${last.by ? ' par ' + esc(last.by) : ''}` : '');
    }
  } else {
    big = last ? `Dernier repas ${dayWord(last.date, now)} à ${hm(last.date)}` : 'Aucun repas noté pour le moment';
    sub = last && last.by ? `Donné par ${esc(last.by)}` : 'Appuyez sur le bouton après avoir servi la gamelle.';
  }

  const feeders = f.feeders || [];
  if (!feeders.includes(feeder)) feeder = feeders.includes(store('doovlab_feeder_' + token)) ? store('doovlab_feeder_' + token) : (feeders[0] || '');
  const canUndo = lastLogged && (Date.now() - lastLogged.at < 14 * 60 * 1000) && meals.some(m => m.id === lastLogged.id);

  const whoHtml = feeders.length ? `<div class="who"><span class="who-label">Qui donne le repas ?</span>
      ${feeders.map(p => `<button class="chip${p === feeder ? ' on' : ''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>` : '';

  const statusHtml = `
    <div class="card status ${cls}">
      <div class="status-big">${big}</div>
      <div class="status-sub">${sub}</div>
      ${showBtn ? whoHtml + `<button class="fed-btn" id="fed-btn">✔ J'ai donné le repas</button>`
                : (canUndo ? '' : `<button class="fed-again" id="fed-again">Noter un autre repas</button>`)}
      ${canUndo ? `<div class="undo">C'était une erreur ? <button id="undo-btn">Annuler</button></div>` : ''}
      <div class="msg" id="msg"></div>
    </div>`;

  // --- ration
  let rationHtml = '';
  if (f.grams || times.length || f.food || f.dose_hint) {
    const todaySlots = times.length ? slots(times, now).filter(s => sameDay(s.at, now)) : [];
    const cur = times.length ? slotOf(slots(times, now), now) : null;
    rationHtml = `
    <div class="card">
      <div class="card-title">Ration</div>
      ${(f.grams || times.length) ? `<div class="ration">
        ${f.grams ? `<div class="stat"><b>${esc(f.grams)} g</b><small>par repas</small></div>` : ''}
        ${times.length ? `<div class="stat"><b>${times.length}</b><small>repas par jour</small></div>` : ''}
      </div>` : ''}
      ${(f.food || f.dose_hint) ? `<div class="food">🥣 ${f.food ? `<b>${esc(f.food)}</b>` : ''}${f.food && f.dose_hint ? ' · ' : ''}${f.dose_hint ? 'soit ' + esc(f.dose_hint) : ''}</div>` : ''}
      ${todaySlots.length ? `<div class="times">${todaySlots.map(s => {
        const done = mealIn(s, meals);
        const isNext = !done && cur && s.at.getTime() === cur.at.getTime();
        return `<div class="time${done ? ' done' : isNext ? ' next' : ''}"><b>${hm(s.at)}</b>${done ? 'donné ✔' : isNext ? 'à donner' : (s.at > now ? 'à venir' : '—')}</div>`;
      }).join('')}</div>` : ''}
    </div>`;
  }

  // --- à savoir
  const rows = [];
  if (f.medication) rows.push(['💊', 'Dans le repas', esc(f.medication)]);
  if (f.treats) rows.push(['🦴', 'Friandises', esc(f.treats)]);
  if (f.forbidden) rows.push(['⛔', 'Interdit', `<div class="pills">${f.forbidden.split(/[,;\n]/).map(s => s.trim()).filter(Boolean).map(s => `<span class="pill">${esc(s)}</span>`).join('')}</div>`]);
  if (f.water) rows.push(['💧', 'Eau', esc(f.water)]);
  if (f.note) rows.push(['📝', 'Note pour la personne qui garde', esc(f.note).replace(/\n/g, '<br>')]);
  const infoHtml = rows.length ? `<div class="card"><div class="card-title">À savoir</div>
    ${rows.map(r => `<div class="row"><div class="ic">${r[0]}</div><div><div class="lbl">${r[1]}</div>${r[2]}</div></div>`).join('')}</div>` : '';

  // --- historique
  const histHtml = `<div class="card"><div class="card-title">Derniers repas</div>
    ${meals.length ? `<ul class="hist">${meals.slice(0, 8).map(m => `<li><span>${cap(dayWord(m.date, now))} · ${hm(m.date)}</span><span class="by">${esc(m.by || '')}</span></li>`).join('')}</ul>`
                   : `<p class="empty">Aucun repas noté pour le moment.</p>`}</div>`;

  page.innerHTML = `
    <div class="hero">
      <div class="photo-bubble"><span id="ph">🐕</span>${f.photo_url ? `<img src="${esc(f.photo_url)}" alt="Photo de ${esc(name)}" onload="this.style.display='block';document.getElementById('ph').style.display='none';">` : ''}</div>
      <div><div class="kicker">Fiche repas</div><div class="dog-name">${esc(name)}</div></div>
    </div>
    ${statusHtml}${rationHtml}${infoHtml}${histHtml}
    <div class="footer"><img src="/logo.png" alt="Doovlab"><p>Rehausseur NFC fabriqué par <a href="index.html">Doovlab</a><br>Impression 3D artisanale · France</p></div>`;

  page.querySelectorAll('.chip').forEach(c => c.onclick = () => { feeder = c.dataset.p; store('doovlab_feeder_' + token, feeder); render(); });
  const fb = document.getElementById('fed-btn'); if (fb) fb.onclick = logMeal;
  const fa = document.getElementById('fed-again'); if (fa) fa.onclick = logMeal;
  const ub = document.getElementById('undo-btn'); if (ub) ub.onclick = undoMeal;
}

// ---------- actions ----------
async function logMeal() {
  const btn = document.getElementById('fed-btn') || document.getElementById('fed-again');
  btn.disabled = true;
  try {
    const id = await rpc('log_repas', { p_token: token, p_by: feeder || null });
    if (id === -1) { document.getElementById('msg').textContent = 'Un repas vient déjà d\'être noté il y a moins d\'une minute.'; btn.disabled = false; return; }
    if (!id) throw new Error('gamelle inconnue');
    lastLogged = { id, at: Date.now() };
    await load(true);
    toast('Repas noté ✔');
  } catch (e) {
    document.getElementById('msg').textContent = 'Impossible de noter le repas. Vérifiez la connexion et réessayez.';
    btn.disabled = false;
  }
}
async function undoMeal() {
  try {
    const ok = await rpc('annuler_repas', { p_token: token, p_id: lastLogged.id });
    lastLogged = null;
    await load(true);
    toast(ok ? 'Repas annulé' : 'Trop tard pour annuler');
  } catch (e) { document.getElementById('msg').textContent = 'Impossible d\'annuler. Réessayez.'; }
}

// ---------- chargement ----------
async function load(silent) {
  if (!token) {
    page.innerHTML = `<div class="error-card"><div class="icon">🔍</div><h2>Fiche introuvable</h2><p>Ce lien ne correspond à aucun rehausseur Doovlab.</p></div>`;
    return;
  }
  try {
    const data = await rpc('get_gamelle', { p_token: token });
    if (!data) {
      page.innerHTML = `<div class="error-card"><div class="icon">🐾</div><h2>Rehausseur non activé</h2><p>Ce rehausseur n'a pas encore été configuré. Si vous en êtes le propriétaire, contactez <a href="mailto:contact@doovlab.fr">contact@doovlab.fr</a>.</p></div>`;
      return;
    }
    fiche = data;
    const empty = !data.dog_name && !data.grams && !(data.times || []).length && !data.food;
    if (empty) {
      page.innerHTML = `<div class="error-card"><div class="icon">📝</div><h2>Fiche repas pas encore remplie</h2><p>Le propriétaire de ce rehausseur n'a pas encore renseigné la fiche repas.<br>Si ce rehausseur est le vôtre, utilisez le QR&nbsp;code fourni dans votre colis.</p></div>`;
      return;
    }
    render();
  } catch (e) {
    if (!silent) page.innerHTML = `<div class="error-card"><div class="icon">⚠️</div><h2>Erreur de connexion</h2><p>Impossible de charger la fiche repas. Réessayez dans quelques instants.</p></div>`;
    else throw e;
  }
}

load();
// L'état change avec l'heure (le repas du soir devient « à donner ») : on rafraîchit
// quand on revient sur la page et toutes les 5 minutes si elle reste ouverte.
document.addEventListener('visibilitychange', () => { if (!document.hidden && fiche) load(true).catch(() => {}); });
setInterval(() => { if (!document.hidden && fiche) load(true).catch(() => {}); }, 5 * 60 * 1000);
</script>
</body>
</html>
